<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCBuilders Image Collage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 20px;
      background-color: #080411;
      background-image:
        linear-gradient(rgba(120, 91, 190, 0.15) 2px, transparent 2px),
        linear-gradient(90deg, rgba(120, 91, 190, 0.15) 2px, transparent 2px),
        radial-gradient(circle at 50% 20%, rgba(79, 24, 177, 0.42), transparent 62%);
      background-size: 54px 54px, 54px 54px, cover;
    }

    /* Image collage only */
    .shop-collage {
      position: relative;
      width: min(100%, 880px);
      aspect-ratio: 2.04 / 1;
      margin: 0 auto;
      isolation: isolate;
    }

    .shop-collage__tile {
      position: absolute;
      overflow: hidden;
      background: #1a1230;
    }

    .shop-collage__tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 350ms ease;
    }

    .shop-collage__tile:hover img {
      transform: scale(1.04);
    }

    /* Large PC build image at the left, spanning both rows */
    .shop-collage__pc {
      z-index: 1;
      left: 0;
      top: 0;
      width: 44%;
      height: 100%;
      clip-path: polygon(75% 0%, 100% 50%, 75% 100%, 0% 100%, 25% 50%, 0% 0%);
    }

    /* Top row */
    .shop-collage__keyboard {
      z-index: 2;
      left: 34%;
      top: 0;
      width: 35%;
      height: 49%;
      clip-path: polygon(0 0, 69% 0, 100% 100%, 31% 100%);
    }

    .shop-collage__headset {
      z-index: 2;
      left: 59%;
      top: 0;
      width: 35%;
      height: 49%;
      clip-path: polygon(0 0, 69% 0, 100% 100%, 31% 100%);
    }

    /* Bottom row */
    .shop-collage__mouse {
      z-index: 2;
      left: 34%;
      top: 50.7%;
      width: 35%;
      height: 49%;
      clip-path: polygon(31% 0%, 100% 0%, 69% 100%, 0% 100%);
    }

    .shop-collage__gpu {
      z-index: 2;
      left: 59%;
      top: 50.7%;
      width: 35%;
      height: 49%;
      clip-path: polygon(31% 0%, 100% 0%, 69% 100%, 0% 100%);
    }
  </style>
</head>
<body>
  <section class="shop-collage" aria-label="PC parts and gaming accessories">
    <!-- Replace these src paths with your real image filenames. -->
    <div class="shop-collage__tile shop-collage__pc">
      <img src="images/limitedtime_items/multimedia_speaker_2.0.png" alt="Custom-built PC" />
    </div>
    <div class="shop-collage__tile shop-collage__keyboard">
      <img src="images/limitedtime_items/multimedia_speaker_2.0.png" alt="Gaming keyboard" />
    </div>
    <div class="shop-collage__tile shop-collage__headset">
      <img src="images/limitedtime_items/multimedia_speaker_2.0.png" alt="Gaming headset" />
    </div>
    <div class="shop-collage__tile shop-collage__mouse">
      <img src="images/limitedtime_items/multimedia_speaker_2.0.png" alt="Gaming mouse" />
    </div>
    <div class="shop-collage__tile shop-collage__gpu">
      <img src="images/limitedtime_items/multimedia_speaker_2.0.png" alt="Graphics card" />
    </div>
  </section>
</body>
</html>
