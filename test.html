<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #08001d;
        }

        .search-bar {
            width: 100%;
            height: 100px;
            background: transparent;
            border: 4px solid white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            color: white;
            font-family: Arial, sans-serif;
        }

        .filter-icon {
            width: 38px;
            height: 38px;
            margin-right: 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .divider {
            height: 65px;
            width: 3px;
            background: rgb(255, 255, 255);
            margin-right: 25px;
            margin-left: 25px;
        }
        .search-input {
            flex: 1;

            border: none;
            outline: none;

            background: transparent;
            color: white;

            font-size: 32px;
            font-weight: 400;

            font-family: Arial, sans-serif;
        }
        .search_p {
            color: white;
            font-size: 32px;
            font-weight: 400;
            font-family: Arial, sans-serif;
        }

        .search-input::placeholder {
            color: rgb(122, 122, 122);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="search-bar">

        <div class="filter-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="currentColor" class="bi bi-funnel"
                viewBox="0 0 16 16">
                <path
                    d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z" />
            </svg>
        </div>
        <p class="search_p">Search:</p>
        <div class="divider"></div>

        <input class="search-input" type="text" placeholder="Enter your search here">

    </div>

</body>

</html>
